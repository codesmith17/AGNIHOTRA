name: OTA Release

# Fully automated, free OTA publishing + installable APKs.
#
# Trigger options:
#   * Push a tag like v1.0.2            -> publishes that version
#   * Run manually (workflow_dispatch)  -> publishes package.json's version
#
# It builds the web bundle, zips public/ (index.html at the zip root), writes
# version.json, builds a DEBUG ("test") APK and a signed RELEASE APK, and
# uploads ALL of them as assets on a GitHub Release marked "latest". The app's
# https://github.com/<owner>/<repo>/releases/latest/download/version.json URL
# then resolves to the new bundle; devices pick it up in the background and
# apply it on the next natural restart (outside ritual windows).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      min_native:
        description: "Minimum native APK version required to apply this bundle"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Build web bundle + OTA manifest
        env:
          AGNI_OTA_MIN_NATIVE: ${{ github.event.inputs.min_native }}
        run: npm run ota:pack

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug + release APKs
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Package and sign APKs for release
        run: |
          V="${{ steps.ver.outputs.version }}"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          mkdir -p release/ota "$HOME/.android"

          # GitHub runners have no ~/.android/debug.keystore unless we create it
          # (local dev gets one from Android Studio / Gradle). Same credentials
          # as the standard Android debug key so installs behave like local builds.
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "Debug APK not found at $DEBUG_APK" >&2
            ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || true
            exit 1
          fi
          cp "$DEBUG_APK" "release/ota/agnihotra-v${V}-test-debug.apk"

          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          fi
          if [ ! -f "$UNSIGNED" ]; then
            echo "Release APK not found under android/app/build/outputs/apk/release/" >&2
            ls -la android/app/build/outputs/apk/release/ 2>/dev/null || true
            exit 1
          fi

          "$BT/zipalign" -f -v -p 4 "$UNSIGNED" /tmp/agnihotra-aligned.apk >/dev/null
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "release/ota/agnihotra-v${V}-release.apk" \
            /tmp/agnihotra-aligned.apk
          "$BT/apksigner" verify --print-certs "release/ota/agnihotra-v${V}-release.apk"
          ls -la release/ota

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OTA ${{ steps.ver.outputs.tag }}
          body: |
            Self-hosted OTA web bundle for EternalAgni.

            Assets:
            - `version.json` + `dist.zip` — the OTA web bundle (auto-applied by installed apps).
            - `agnihotra-v${{ steps.ver.outputs.version }}-test-debug.apk` — debug/test build (verbose logs).
            - `agnihotra-v${{ steps.ver.outputs.version }}-release.apk` — release build (debug-signed, installable).
          make_latest: "true"
          files: |
            release/ota/dist.zip
            release/ota/version.json
            release/ota/agnihotra-v${{ steps.ver.outputs.version }}-test-debug.apk
            release/ota/agnihotra-v${{ steps.ver.outputs.version }}-release.apk
